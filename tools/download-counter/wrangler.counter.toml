# Worker neurofly-downloads (worker.js): download counter and site statistics.
name = "neurofly-downloads"
main = "worker.js"
# get.neuro-cause.com is the current address; get.neurofly.app keeps older links working.
routes = [
  { pattern = "get.neuro-cause.com", custom_domain = true },
  { pattern = "get.neurofly.app", custom_domain = true },
]
compatibility_date = "2026-09-01"
workers_dev = false
preview_urls = false

[[d1_databases]]
binding = "DB"
database_name = "neurofly-downloads"
database_id = "82859622-789e-4092-96a7-0a646341c0ab"

[observability]
enabled = false

[triggers]
crons = ["0 * * * *"]
