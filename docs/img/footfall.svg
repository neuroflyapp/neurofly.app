<title id="ff-title">Footfall pattern of the simulated fly</title>
<desc id="ff-desc">Ground contact of each of the six legs over 2.5 seconds of walking in a NeuroFly simulation run. Filled bars mark ground contact. The rows are grouped into the two tripods of a fly's alternating gait: right front, left middle and right hind above, left front, right middle and left hind below. In the model the legs step irregularly and the two groups alternate only loosely.</desc>
