<body>
<noscript><main style="max-width:640px;margin:48px auto;padding:0 20px;font:16px/1.6 system-ui,sans-serif;color:#F9F6F1"><h1>A simulated fly brain, in your browser</h1><p>A fruit fly driven by a simulated brain, wired from a published connectome. Startle it, feed it, replay its spikes in slow motion and run experiments: free, in your browser, without an account.</p><p>This page runs the model on your device and needs JavaScript and WebGL 2. <a href="https://neuro-cause.com/" style="color:#00FF41">More about NeuroCause</a></p></main></noscript>
<div id="boot" role="status" aria-live="polite">
  <div class="boot-mark" role="img" aria-label="NeuroCause"></div>
  <div class="boot-line" id="bootLine">Loading the connectome…</div>
  <div class="boot-bar"><span id="bootBar"></span></div>
</div>
<header id="topbar">
  <div class="wordmark" role="img" aria-label="NeuroCause"></div>
  <div id="runStatus"></div>
  <div id="topActions"></div>
</header>
<div id="workspace">
  <nav id="rail" aria-label="Workspaces" role="tablist" aria-orientation="vertical"></nav>
  <aside id="panel" aria-live="off"></aside>
  <main id="stage">
    <section id="terrarium" aria-label="Terrarium">
      <div id="hud"></div>
    </section>
    <section id="dock" aria-label="Measurements"></section>
  </main>
  <aside id="inspector">
    <section id="brain" aria-label="Connectome"></section>
    <section id="why" aria-label="Why she did it"></section>
  </aside>
</div>
<div id="toasts" aria-live="polite"></div>
<script type="module" src="./renderer/app.js"></script>
</body>
